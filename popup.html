<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>TL Çevirici</title>
  <style>
    :root { color-scheme: light dark; --bg:#fff; --fg:#111827; --mute:#6b7280; --line:#d1d5db; --acc:#2563eb; }
    @media (prefers-color-scheme: dark) { :root { --bg:#111827; --fg:#f9fafb; --mute:#9ca3af; --line:#374151; --acc:#60a5fa; } }
    body { margin:0; padding:14px; width:280px; background:var(--bg); color:var(--fg);
           font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    .row { display:flex; gap:6px; align-items:center; margin-bottom:8px; }
    /* Şeffaf arka plan açılır listede beyaz zemin + açık yazı veriyordu; zemini açıkça ver. */
    input, select, option, button { font:inherit; color:var(--fg); background:var(--bg);
           border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
    input { flex:1; min-width:0; }
    button { cursor:pointer; padding:6px 10px; }
    input:focus-visible, select:focus-visible, button:focus-visible { outline:2px solid var(--acc); outline-offset:1px; }
    #out { font-size:18px; font-weight:600; margin:10px 0 2px; min-height:25px; }
    #info { color:var(--mute); font-size:12px; }
  </style>
</head>
<body>
  <div class="row">
    <input id="amount" type="text" inputmode="decimal" value="1" aria-label="Tutar (örn. 100 veya 100 dolar)" placeholder="100 veya 100 dolar" autofocus>
    <select id="from" aria-label="Kaynak para birimi"></select>
  </div>
  <div class="row">
    <button id="swap" type="button" aria-label="Para birimlerini değiştir" title="Değiştir">⇅</button>
    <select id="to" aria-label="Hedef para birimi" style="flex:1"></select>
  </div>
  <div id="out" aria-live="polite"></div>
  <div id="info"></div>
  <script src="parser.js"></script>
  <script src="popup.js"></script>
</body>
</html>
