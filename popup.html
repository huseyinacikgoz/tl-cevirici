<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>TL Çevirici</title>
  <style>
    /* Renkler ui.js'ten gelir; betik yüklenene kadar sistem temasına uyan yedek değerler. */
    :root { color-scheme: light; --bg:#fff; --fg:#111827; --mute:#6b7280; --line:#d1d5db; --acc:#2563eb; --err:#b91c1c; }
    @media (prefers-color-scheme: dark) { :root { color-scheme: dark; --bg:#111827; --fg:#f9fafb; --mute:#9ca3af; --line:#374151; --acc:#60a5fa; --err:#fca5a5; } }
    body { margin:0; padding:14px; width:280px; background:var(--bg); color:var(--fg);
           font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    .top { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
    .top strong { font-size:15px; }
    .themes { margin-left:auto; display:flex; gap:6px; align-items:center; }
    /* iOS tarzı anahtar: gerçek checkbox görünmez ama odaklanabilir, görünümü .track verir. */
    .switch { margin-left:auto; position:relative; display:inline-flex; cursor:pointer; }
    .switch input { position:absolute; inset:0; opacity:0; margin:0; padding:0; cursor:pointer; }
    .track { width:38px; height:22px; border-radius:999px; background:var(--line); position:relative; transition:background .2s; }
    .track::before { content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%;
                     background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.35); transition:transform .2s; }
    .switch input:checked + .track { background:var(--acc); }
    .switch input:checked + .track::before { transform:translateX(16px); }
    .switch input:focus-visible + .track { outline:2px solid var(--acc); outline-offset:2px; }
    @media (prefers-reduced-motion: reduce) { .track, .track::before { transition:none; } }
    .sw { width:16px; height:16px; padding:0; border-radius:50%; border:1px solid var(--line); cursor:pointer; }
    .sw[aria-checked="true"] { outline:2px solid var(--acc); outline-offset:1px; }
    .row { display:flex; gap:6px; }
    /* Şeffaf arka plan açılır listede beyaz zemin + açık yazı veriyordu; zemini açıkça ver. */
    input, select, option, button { font:inherit; color:var(--fg); background:var(--bg);
           border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
    input { flex:1; min-width:0; }
    select { width:84px; }
    /* Değiştir ikonu tutar kutusunun ortasında dursun: sağdaki para birimi listesi (84px) + boşluk (6px) kadar kaydır. */
    .mid { display:flex; justify-content:center; margin:6px 0; padding-right:90px; }
    .icon { display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px;
            padding:0; cursor:pointer; color:var(--fg); text-decoration:none; box-sizing:border-box;
            border:1px solid var(--line); border-radius:6px; }
    .icon:hover { border-color:var(--acc); }
    .icon:disabled { opacity:.5; cursor:default; }
    input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible { outline:2px solid var(--acc); outline-offset:1px; }
    #rate { font-weight:600; margin-top:12px; min-height:20px; }
    #info { color:var(--mute); font-size:12px; min-height:17px; }
    #info.err { color:var(--err); }
    #info.loading::before { content:""; display:inline-block; width:10px; height:10px; margin-right:6px; vertical-align:-1px;
           border:2px solid var(--line); border-top-color:var(--acc); border-radius:50%; animation:r .7s linear infinite; }
    @keyframes r { to { transform:rotate(360deg) } }
    @media (prefers-reduced-motion: reduce) { #info.loading::before { animation-duration:2s; } }
    #source { width:auto; padding:4px 6px; font-size:12px; }
    .foot { display:flex; gap:8px; align-items:center; margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
  </style>
</head>
<body>
  <header class="top">
    <img src="icons/icon48.png" width="24" height="24" alt="">
    <strong>TL Çevirici</strong>
    <label class="switch" id="switch" title="Sayfadaki balon açık">
      <input id="enabled" type="checkbox" role="switch" checked aria-label="Sayfada balon göster">
      <span class="track" aria-hidden="true"></span>
    </label>
  </header>
  <div class="row">
    <input id="amount" type="text" inputmode="decimal" value="1" aria-label="Tutar (örn. 100 veya 100 dolar)" placeholder="100 veya 100 dolar" autofocus>
    <select id="from" aria-label="Kaynak para birimi"></select>
  </div>
  <div class="mid">
    <button id="swap" class="icon" type="button" aria-label="Para birimlerini değiştir" title="Değiştir"></button>
  </div>
  <div class="row">
    <input id="result" type="text" inputmode="decimal" aria-label="Karşılık tutar">
    <select id="to" aria-label="Hedef para birimi"></select>
  </div>
  <div id="rate" aria-live="polite"></div>
  <div id="info"></div>
  <div class="foot">
    <button id="refresh" class="icon" type="button" title="Kuru güncelle" aria-label="Kuru güncelle"></button>
    <select id="source" aria-label="Kur kaynağı" title="Kur kaynağı">
      <option value="tcmb">TCMB</option>
      <option value="ecb">ECB</option>
    </select>
    <a id="github" class="icon" target="_blank" rel="noopener noreferrer" title="GitHub" aria-label="GitHub"></a>
    <div class="themes" id="themes" role="radiogroup" aria-label="Tema"></div>
  </div>
  <script src="parser.js"></script>
  <script src="ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
